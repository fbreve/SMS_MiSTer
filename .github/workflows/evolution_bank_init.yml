name: Evolution bank init
on:
  push:
    branches: [evolution-mapper]

jobs:
  patch:
    if: github.actor == 'fbreve'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evolution-mapper
          fetch-depth: 0
      - name: Initialize SMS banks on Evolution game entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rtl/system.vhd')
          s = p.read_text()
          old = "\t\t\t\tif bootloader_n = '0' and mapper_lock = '0' then"
          new = "\t\t\t\tif mapper_evolution_force = '1' and ss_freeze = '0' and WR_n = '0' and MREQ_n = '0' and A = x\"3FFE\" and D_in(1) = '1' then\n\t\t\t\t\tbank0 <= x\"00\";\n\t\t\t\t\tbank1 <= x\"01\";\n\t\t\t\t\tbank2 <= x\"02\";\n\t\t\t\tend if;\n\t\t\t\tif bootloader_n = '0' and mapper_lock = '0' then"
          if s.count(old) != 1:
              raise SystemExit(f'expected one mapper reset insertion point, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'Evolution bot'
          git config user.email 'evolution-bot@users.noreply.github.com'
          git add rtl/system.vhd
          git commit -m '[evolution-bot] Reset SMS banks on Evolution game entry'
          git push origin evolution-mapper
