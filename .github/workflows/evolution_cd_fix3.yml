name: Evolution CD fix 3

on:
  push:
    branches: [evolution-mapper]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[evolution-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evolution-mapper
          fetch-depth: 0

      - name: Patch Evolution port $CD read
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('rtl/system.vhd')
          s = p.read_text()

          pattern = r"(\tprocess \(IORQ_n,A,vdp_D_out,vdp2_D_out,io_D_out,irom_D_out,ram_D_out,nvram_D_out,.*?\n\tbegin\n)(\t\tif IORQ_n='0' then\n)"
          m = re.search(pattern, s, re.S)
          if not m:
              raise SystemExit('could not locate CPU D_out mux')

          prefix = m.group(1)
          if "mapper_evolution_force='1' and A(7 downto 0)=x\"CD\"" in s[m.start():m.end()+2000]:
              raise SystemExit('Evolution $CD fix already present')

          target = m.group(2)
          insert = ("\t\tif IORQ_n='0' then\n"
                    "\t\t\tif mapper_evolution_force='1' and A(7 downto 0)=x\"CD\" then\n"
                    "\t\t\t\t-- Evolution uses port $CD as an internal control/status input.\n"
                    "\t\t\t\t-- During normal execution it reads as zero.\n"
                    "\t\t\t\tD_out <= x\"00\";\n"
                    "\t\t\telsif A(7 downto 0)=x\"F2\" and fm_ena = '1' and systeme='0' then\n")
          s = s[:m.start(2)] + insert + s[m.end(2):]
          p.write_text(s)
          PY

          git diff --check
          git config user.name 'Evolution bot'
          git config user.email 'evolution-bot@users.noreply.github.com'
          git add rtl/system.vhd
          git diff --cached --check
          git diff --cached -- rtl/system.vhd
          git commit -m '[evolution-bot] Handle Evolution port CD in system read mux'

          rm -f .github/workflows/evolution_cd_fix3.yml \
                .github/workflows/evolution_portcd_fix.yml \
                .github/workflows/evolution_portcd_fix2.yml
          git add -A .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m '[evolution-bot] Remove temporary Evolution CD workflows'
          fi
          git push origin evolution-mapper
