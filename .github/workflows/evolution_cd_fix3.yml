name: Evolution CD fix 3

on:
  push:
    branches: [evolution-mapper]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[evolution-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evolution-mapper
          fetch-depth: 0

      - name: Patch Evolution port $CD read
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('rtl/io.vhd')
          s = p.read_text()

          anchor = "\t\t\t\telsif A(0)='0' then"
          if s.count(anchor) != 1:
              raise SystemExit(f'io.vhd read-port anchor count != 1: {s.count(anchor)}')

          insert = (
              "\t\t\t\telsif mapper_evolution_force='1' and A=x\"CD\" then\n"
              "\t\t\t\t\t-- Master System Evolution uses port $CD as an internal\n"
              "\t\t\t\t\t-- control/status input. During normal execution it reads as zero.\n"
              "\t\t\t\t\tD_out <= x\"00\";\n"
          )
          # Remove the just-added branch if it already exists in a previous tree.
          if "mapper_evolution_force='1' and A=x\"CD\"" in s:
              raise SystemExit('Evolution $CD fix already present')
          s = s.replace(anchor, insert + anchor, 1)
          p.write_text(s)
          PY

          git diff --check
          git config user.name 'Evolution bot'
          git config user.email 'evolution-bot@users.noreply.github.com'
          git add rtl/io.vhd
          git diff --cached --check
          git commit -m '[evolution-bot] Handle Evolution port CD read'
          git push origin evolution-mapper
