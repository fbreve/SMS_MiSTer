name: Evolution port CD fix
on:
  push:
    branches: [evolution-mapper]

jobs:
  patch:
    if: github.actor == 'fbreve'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evolution-mapper
          fetch-depth: 0
      - name: Apply Evolution port $CD fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------- rtl/io.vhd ----------
          p = Path('rtl/io.vhd')
          s = p.read_text()
          old = '\t\tsysteme:\tin  STD_LOGIC;\n'
          new = old + '\t\tmapper_evolution_force: in STD_LOGIC := \'0\';\n'
          if s.count(old) != 1:
              raise SystemExit(f'io.vhd systeme anchor count != 1: {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '\t\t\telsif A(0)=\'1\' then\n'
          new = ('\t\t\telsif mapper_evolution_force=\'1\' and A=x"CD" then\n'
                 '\t\t\t\t-- Master System Evolution uses port $CD as an internal\n'
                 '\t\t\t\t-- mapper/control flag. It reads as 0 during normal execution.\n'
                 '\t\t\t\tD_out <= x"00";\n'
                 '\t\t\telsif A(0)=\'1\' then\n')
          if s.count(old) != 1:
              raise SystemExit(f'io.vhd A(0)=1 anchor count != 1: {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ---------- rtl/system.vhd ----------
          p = Path('rtl/system.vhd')
          s = p.read_text()
          old = '\t\tsysteme\t=> systeme,\n'
          new = old + '\t\tmapper_evolution_force => mapper_evolution_force,\n'
          if s.count(old) != 1:
              raise SystemExit(f'system.vhd io_inst systeme anchor count != 1: {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git diff --check
          git config user.name 'Evolution bot'
          git config user.email 'evolution-bot@users.noreply.github.com'
          git add rtl/io.vhd rtl/system.vhd
          git diff --cached --check
          git commit -m '[evolution-bot] Return zero from Evolution port CD'
          rm .github/workflows/evolution_portcd_fix.yml
          git add .github/workflows/evolution_portcd_fix.yml
          git commit -m '[evolution-bot] Remove temporary port CD workflow'
          git push origin evolution-mapper
