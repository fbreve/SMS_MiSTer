name: Evolution palette fix
on:
  push:
    branches: [evolution-mapper]

jobs:
  patch:
    if: github.actor == 'fbreve'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evolution-mapper
          fetch-depth: 0
      - name: Apply surgical palette change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('rtl/system.vhd')
          s = p.read_text()
          new = '\t\tgg\t\t\t=> gg or (mapper_evolution_force and not evolution_3ffe(1)),'
          for name in ('vdp_inst', 'vdp2_inst'):
              m = re.search(r'\n\t' + name + r': entity work\.vdp.*?\n\t\);', s, re.S)
              if not m:
                  raise SystemExit(f'could not locate {name}')
              block = m.group(0)
              old = '\t\tgg\t\t\t=> gg,'
              if block.count(old) != 1:
                  raise SystemExit(f'expected one gg mapping in {name}, found {block.count(old)}')
              block = block.replace(old, new, 1)
              s = s[:m.start()] + block + s[m.end():]
          p.write_text(s)
          PY
          git config user.name 'Evolution bot'
          git config user.email 'evolution-bot@users.noreply.github.com'
          git add rtl/system.vhd
          git commit -m '[evolution-bot] Use GG palette format for Evolution menu'
          git push origin evolution-mapper
