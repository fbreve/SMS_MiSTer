name: Evolution game vector fix
on:
  push:
    branches: [evolution-mapper]

jobs:
  patch:
    if: github.actor == 'fbreve'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evolution-mapper
          fetch-depth: 0
      - name: Remove Evolution first-1KB exception
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rtl/system.vhd')
          s = p.read_text()
          old = 'if A(13 downto 10)="0000" and mapper_codies=\'0\' then'
          new = 'if A(13 downto 10)="0000" and mapper_codies=\'0\' and not (mapper_evolution_force=\'1\' and evolution_3ffe(1)=\'1\') then'
          if s.count(old) != 1:
              raise SystemExit(f'expected one slot-0 exception, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'Evolution bot'
          git config user.email 'evolution-bot@users.noreply.github.com'
          git add rtl/system.vhd
          git commit -m '[evolution-bot] Map Evolution game vectors from selected base'
          git push origin evolution-mapper
